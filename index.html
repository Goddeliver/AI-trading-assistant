<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forex AI Assistant</title>
<style>
body{font-family:Arial;background:#111;color:#fff;padding:20px}
#chat{max-width:600px;margin:auto;background:#222;padding:20px;border-radius:10px}
input{width:70%;padding:12px;border-radius:5px;border:none}
button{padding:12px 15px;background:#00ff88;border:none;border-radius:5px;font-weight:bold}
#ans{margin-top:20px;background:#333;padding:15px;border-radius:5px;min-height:50px}
</style>
</head>
<body>
<div id="chat">
<h2>Forex AI Assistant</h2>
<input id="q" placeholder="Ask e.g. what is order block?">
<button onclick="askAI()">Ask</button>
<div id="ans">Ask me anything about forex!</div>
</div>
<script>
async function askAI(){
  let question = document.getElementById('q').value;
  let ans = document.getElementById('ans');
  ans.innerText = "Thinking...";
  let res = await fetch('/ask', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({question: question})
  });
  let data = await res.json();
  ans.innerText = data.answer;
}
</script>
</body>
</html>
